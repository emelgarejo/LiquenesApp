<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c0e" />
    <title>Líquenes Bioindicador · Cristo Salvador 6°B</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="header-title">
          <span class="grade-chip" title="Grado">6°B</span>
          <h1>Líquenes Bioindicador</h1>
        </div>
        <div class="header-brand">
          <img
            class="brand-banner"
            src="./branding/colegio-banner.png"
            width="320"
            height="72"
            alt="Colegio Particular Cristo Salvador — IB World School"
          />
        </div>
      </header>

      <div class="map-stage">
        <aside id="legend" class="legend" hidden></aside>
        <aside id="tool-rail" class="tool-rail" aria-label="Herramientas">
          <label
            class="tool-btn tool-heat"
            data-tooltip="Mapa de calor"
          >
            <input
              type="checkbox"
              id="heat-toggle"
              class="visually-hidden"
              aria-label="Mostrar mapa de calor"
              checked
            />
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M12 2c2.2 3.1 4 5.7 4 8.2A4 4 0 1 1 8 10.2C8 7.7 9.8 5.1 12 2Zm-5.5 14.2a5.5 5.5 0 0 0 11 0c0-.7-.2-1.4-.5-2.1-.9 1.5-2.5 2.4-4.5 2.4s-3.6-.9-4.5-2.4c-.3.7-.5 1.4-.5 2.1Z"
              />
            </svg>
          </label>
          <div class="tool-rail-sep" aria-hidden="true"></div>
          <button
            type="button"
            class="tool-btn"
            data-panel="ficha"
            data-tooltip="Ficha técnica"
            aria-label="Ficha técnica"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M8 3h8a2 2 0 0 1 2 2v1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h1V5a2 2 0 0 1 2-2Zm0 3h8V5H8v1Zm-1 4v2h10v-2H7Zm0 4v2h7v-2H7Z"
              />
            </svg>
          </button>
          <button
            type="button"
            class="tool-btn"
            data-panel="investigacion"
            data-tooltip="Investigación"
            aria-label="Investigación"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M6 3h9l4 4v14H6V3zm8 1.5V8h3.5L14 4.5zM8.5 11H16v1.5H8.5V11zm0 3.25H16v1.5H8.5v-1.5zm0 3.25H14v1.5H8.5V17.5z"
              />
            </svg>
          </button>
          <button
            type="button"
            class="tool-btn"
            data-panel="integrantes"
            data-tooltip="Integrantes"
            aria-label="Integrantes"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M8.5 7a2.75 2.75 0 1 1 0 5.5A2.75 2.75 0 0 1 8.5 7Zm7 0a2.75 2.75 0 1 1 0 5.5A2.75 2.75 0 0 1 15.5 7ZM4 18.25c0-2.2 2.2-3.75 4.5-3.75s4.5 1.55 4.5 3.75V19H4v-.75Zm7.75 0c.3-1.55 1.45-2.8 3.05-3.35.55-.1 1.12-.15 1.7-.15 2.3 0 4.5 1.55 4.5 3.75V19h-9.25v-.75Z"
              />
            </svg>
          </button>
        </aside>
        <main
          id="map"
          class="map"
          role="application"
          aria-label="Mapa del estudio de líquenes en Chama"
        ></main>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </div>

      <dialog id="info-panel" class="info-panel">
        <div class="info-panel-sheet">
          <header class="info-panel-header">
            <h2 id="info-panel-title">Información</h2>
            <button
              type="button"
              class="info-panel-close"
              data-close-panel
              aria-label="Cerrar"
            >
              ×
            </button>
          </header>
          <div id="info-panel-body" class="info-panel-body"></div>
        </div>
      </dialog>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
