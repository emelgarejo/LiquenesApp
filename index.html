<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chama Lichen Bioindicator Heatmap</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1>Chama Lichen Bioindicator Heatmap</h1>
        <div id="provisional-notice"></div>

    <script type="module" src="/src/main.ts"></script>
